syntax = "proto3";

package aimrp.v1;

option csharp_namespace = "Aimrp.Proto.V1";

// ─── Enums ────────────────────────────────────────────────────────────────────

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_PLANNER     = 1;
  ROLE_REASONER    = 2;
  ROLE_CRITIC      = 3;
  ROLE_RETRIEVER   = 4;
}

enum ScoreCriterion {
  SCORE_CRITERION_UNSPECIFIED  = 0;
  SCORE_CRITERION_LOGIC        = 1;
  SCORE_CRITERION_FACTUALITY   = 2;
  SCORE_CRITERION_RELEVANCE    = 3;
  SCORE_CRITERION_COMPLETENESS = 4;
  SCORE_CRITERION_SAFETY       = 5;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED        = 0;
  ERROR_CODE_INVALID_REQUEST    = 1;
  ERROR_CODE_SIGNATURE_INVALID  = 2;
  ERROR_CODE_PEER_UNAVAILABLE   = 3;
  ERROR_CODE_MODEL_ERROR        = 4;
  ERROR_CODE_SESSION_NOT_FOUND  = 5;
  ERROR_CODE_TASK_NOT_FOUND     = 6;
  ERROR_CODE_RATE_LIMITED       = 7;
  ERROR_CODE_INTERNAL_ERROR     = 8;
  ERROR_CODE_VERSION_UNSUPPORTED = 9;
  ERROR_CODE_UNSAFE_PROMPT = 10;
}

// ─── Shared types ─────────────────────────────────────────────────────────────

// Endpoint describes a network address a peer is reachable at.
message Endpoint {
  string type    = 1; // "http-json" (v0.1 primary), "grpc" (future)
  string address = 2; // "host:port"
}

// ModelInfo describes a model served by a peer.
message ModelInfo {
  string name           = 1; // e.g. "llama-3.2-3b"
  uint32 max_context    = 2; // max context window in tokens
  uint32 max_tokens     = 3; // max output tokens
  uint32 avg_latency_ms = 4; // optional routing hint
}

// UsageStats reports token consumption for a single inference call.
message UsageStats {
  uint32 prompt_tokens     = 1;
  uint32 completion_tokens = 2;
}

// TaskStep is one step in a reasoning plan produced by a planner peer.
message TaskStep {
  string step_id        = 1; // UUID
  string description    = 2;
  Role   suggested_role = 3;
}

// ErrorDetail carries structured error information.
message ErrorDetail {
  ErrorCode           code    = 1;
  string              message = 2;
  map<string, string> details = 3; // optional structured context (e.g. peer_id, retry_after_ms)
}

// ErrorResponse is the top-level error envelope returned by all HTTP endpoints on failure.
message ErrorResponse {
  ErrorDetail error = 1;
}

// Error is a transport-agnostic error embedded in domain responses (e.g. InferResponse).
// Equivalent in shape to ErrorDetail; provided as a stable inline type for non-HTTP transports.
message Error {
  string              code    = 1; // canonical error code (see RFC §14)
  string              message = 2;
  map<string, string> details = 3;
}

// PeerManifest is the signed DHT record published by each peer.
message PeerManifest {
  string             peer_id            = 1; // hash of Ed25519 public key
  bytes              pubkey             = 2; // Ed25519 public key (raw bytes)
  repeated Endpoint  endpoints          = 3;
  repeated Role      roles              = 4;
  repeated ModelInfo models             = 5;
  double             reputation_score   = 6; // [-1.0, 1.0]
  uint32             reputation_samples = 7;
  int64              timestamp          = 8; // Unix seconds
  string             nonce              = 9; // anti-replay random string
  bytes              signature          = 10;
  uint32             ttl_seconds        = 11; // record lifetime; 0 = use network default
  string             protocol_version   = 12; // e.g. "0.1" — REQUIRED, covered by signature; prevents DHT-layer downgrade
}

// ─── /capabilities ────────────────────────────────────────────────────────────

message CapabilitiesRequest {
  string protocol_version = 1; // REQUIRED, mirrors AIMRP-Version header
}

message CapabilitiesResponse {
  string             peer_id           = 1;  // hex-encoded SHA-256 of Ed25519 pubkey
  repeated Role      roles             = 2;  // at least one role
  repeated ModelInfo models            = 3;  // at least one model
  repeated string    protocol_versions = 4;  // e.g., ["0.1"] — REQUIRED
  bytes              pubkey            = 5;  // raw Ed25519 public key (32 bytes) — REQUIRED
  repeated Endpoint  endpoints         = 6;  // at least one endpoint — REQUIRED
  string             compliance_level  = 7;  // optional: aimrp-open, aimrp-safe, aimrp-strict
}

// ─── /infer ───────────────────────────────────────────────────────────────────

message InferRequest {
  string          session_id       = 1;  // UUID
  string          task_id          = 2;  // UUID
  string          prompt           = 3;
  uint32          max_tokens       = 4;
  Role            role             = 5;  // role the peer should adopt for this task
  string          protocol_version = 6;  // e.g. "0.1"; mirrors AIMRP-Version header (REQUIRED)
  string          model_name       = 7;  // optional explicit model selection; "" = peer default
  // Optional sampling controls. Peers MAY ignore unsupported parameters.
  double          temperature      = 8;  // [0.0, 2.0]; 0 = deterministic; <0 = unset
  double          top_p            = 9;  // (0.0, 1.0]; <=0 = unset
  repeated string stop             = 10; // optional stop sequences
}

message InferResponse {
  string     task_id          = 1;
  string     completion       = 2;
  double     confidence       = 3; // [0.0, 1.0]
  UsageStats usage            = 4;
  bytes      signature        = 5;
  string     protocol_version = 6; // echo of negotiated version (REQUIRED)
  string     model_name       = 7; // model that actually produced the completion
  Error      error            = 8; // OPTIONAL; present iff the call failed and HTTP status != 2xx
}

// ─── /plan ────────────────────────────────────────────────────────────────────

message PlanRequest {
  string session_id       = 1; // UUID
  string problem          = 2;
  string context          = 3;
  string protocol_version = 4; // REQUIRED, mirrors AIMRP-Version header
}

message PlanResponse {
  string            session_id       = 1;
  repeated TaskStep steps            = 2;
  bytes             signature        = 3;
  string            protocol_version = 4; // REQUIRED
  Error             error            = 5; // OPTIONAL; failure envelope
}

// ─── /score ───────────────────────────────────────────────────────────────────

message ScoreRequest {
  string                  session_id       = 1; // UUID
  string                  task_id          = 2; // UUID
  string                  answer           = 3;
  repeated ScoreCriterion criteria         = 4;
  string                  protocol_version = 5; // REQUIRED
}

message ScoreResponse {
  string              task_id          = 1;
  map<string, double> scores           = 2; // criterion name => score [0.0, 1.0]
  double              overall          = 3; // [0.0, 1.0]
  bytes               signature        = 4;
  string              protocol_version = 5; // REQUIRED
  Error               error            = 6; // OPTIONAL; failure envelope
}

// ─── DHT types ────────────────────────────────────────────────────────────────

// PeerFilter restricts DHT lookup results by role and capabilities.
message PeerFilter {
  Role   role            = 1; // required role
  uint32 max_latency_ms  = 2; // 0 = no constraint
  string model_name_hint = 3; // substring match; "" = no constraint
  double min_reputation  = 4; // minimum reputation score; default -1.0
}

// DhtLookupRequest asks the DHT layer to find peers matching a filter.
message DhtLookupRequest {
  PeerFilter filter      = 1;
  uint32     max_results = 2; // 0 = use network default
}

// DhtLookupResponse returns matching peer manifests.
message DhtLookupResponse {
  repeated PeerManifest peers = 1;
}

// DhtPublishRequest asks the DHT layer to publish or refresh a peer manifest.
message DhtPublishRequest {
  PeerManifest manifest = 1;
}

message DhtPublishResponse {
  bool   success = 1;
  string message = 2;
}

// DhtJoinRequest bootstraps this node into the DHT network.
message DhtJoinRequest {
  string bootstrap_address = 1; // "host:port" of a known bootstrap node
}

message DhtJoinResponse {
  bool   success = 1;
  string message = 2;
}

// DhtLeaveRequest gracefully withdraws this peer from the DHT.
message DhtLeaveRequest {}

message DhtLeaveResponse {
  bool   success = 1;
  string message = 2;
}

// SessionResult is the final response returned by orchestrator to client.
// Represents the consensus result of a complete session.
message SessionResult {
  string   session_id         = 1;  // UUID v4, lowercase hyphenated
  string   answer             = 2;  // consensus answer text
  bool     scored             = 3;  // true if answer was evaluated by critic peers
  double   consensus_weight   = 4;  // [0.0, 1.0] — weighted majority weight of winning answer
  string   winner_peer_id     = 5;  // peer_id of the peer that produced the winning answer
  repeated ScoreCriterion evaluated_criteria = 6;  // criteria used in scoring (if scored=true)
  double   overall_score      = 7;  // [0.0, 1.0] — mean of all criteria scores (if scored=true)
  int64    timestamp          = 8;  // Unix epoch seconds, when consensus was reached
}

// ─── Services ─────────────────────────────────────────────────────────────────

// PeerService exposes the peer node API.
// HTTP/JSON transport is primary in v0.1; gRPC binding defined here for schema and future use.
service PeerService {
  rpc GetCapabilities (CapabilitiesRequest) returns (CapabilitiesResponse);
  rpc Infer           (InferRequest)        returns (InferResponse);
  rpc Plan            (PlanRequest)         returns (PlanResponse);
  rpc Score           (ScoreRequest)        returns (ScoreResponse);
}

// DhtService defines the IDhtClient contract for peer discovery.
// In v0.1 this is implemented as a pure .NET Kademlia library (Sprint 3).
service DhtService {
  rpc Lookup  (DhtLookupRequest)  returns (DhtLookupResponse);
  rpc Publish (DhtPublishRequest) returns (DhtPublishResponse);
  rpc Join    (DhtJoinRequest)    returns (DhtJoinResponse);
  rpc Leave   (DhtLeaveRequest)   returns (DhtLeaveResponse);
}
