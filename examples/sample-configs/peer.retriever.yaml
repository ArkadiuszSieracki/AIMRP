# AIMRP Peer — retriever profile
# Synthesizes context from external sources (vector DB, web, KB).
# Typically pairs an embedding model with a small instruction model.

peer:
  identity:
    key_path: "./peer-retriever-key.pem"

  network:
    listen_address: "0.0.0.0:8080"
    public_address: "retriever-1.example.com:8080"

  roles:
    - retriever

  model_adapter:
    type: openai-compatible
    endpoint: http://localhost:11434/v1
    model: llama3.2:3b                    # synthesis model
    api_key: ""
    temperature: 0.3
    top_p: 0.9

  retriever:
    backend: vector-store                 # vector-store | web | hybrid
    top_k: 5
    max_context_tokens: 2048

  dht:
    bootstrap_address: "bootstrap.aimrp.example.com:4000"
    ttl_seconds: 3600

  liveness:
    heartbeat_interval_seconds: 60

  health:
    interval_seconds: 30
